<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="SafeScreen: your screen goes dark when you look away. One bad frame hides it; three good frames reveal it.">
<defs>
