<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-label="safescreen blacks out the screen when the owner looks away or an unknown face appears">
  <defs>
    <clipPath id="feedClip"><rect x="40" y="104" width="270" height="200" rx="10"/></clipPath>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }

      /* 14s story: look (0-30) -> away (33-52) -> look (54-70) -> unknown face (71-91) -> look */

      .cover { animation: cover 14s linear infinite; }
      @keyframes cover {
        0%, 35% { opacity: 0; }
        37%, 52% { opacity: 1; }
        54%, 71% { opacity: 0; }
        73%, 90% { opacity: 1; }
        92%, 100% { opacity: 0; }
      }

      .head { animation: head 14s ease-in-out infinite; }
      @keyframes head {
        0%, 31% { transform: translateX(0); }
        34%, 52% { transform: translateX(-9px); }
        55%, 100% { transform: translateX(0); }
      }
      .pup { animation: pup 14s ease-in-out infinite; }
      @keyframes pup {
        0%, 31% { transform: translate(0, 0); }
        34%, 52% { transform: translate(-3px, -2px); }
        55%, 100% { transform: translate(0, 0); }
      }

      .boxok { animation: boxok 14s linear infinite; }
      @keyframes boxok { 0%, 31% { opacity: 1; } 33%, 53% { opacity: 0; } 55%, 100% { opacity: 1; } }
      .boxaway { animation: boxaway 14s linear infinite; }
      @keyframes boxaway { 0%, 32% { opacity: 0; } 34%, 52% { opacity: 1; } 54%, 100% { opacity: 0; } }

      .stranger { animation: stranger 14s ease-out infinite; }
      @keyframes stranger {
        0%, 68% { opacity: 0; transform: translateX(26px); }
        71%, 90% { opacity: 1; transform: translateX(0); }
        93%, 100% { opacity: 0; transform: translateX(26px); }
      }

      .s1 { animation: s1 14s linear infinite; }
      .s2 { animation: s2 14s linear infinite; }
      .s3 { animation: s3 14s linear infinite; }
      @keyframes s1 { 0%, 31% { opacity: 1; } 33%, 53% { opacity: 0; } 55%, 69% { opacity: 1; } 71%, 91% { opacity: 0; } 93%, 100% { opacity: 1; } }
      @keyframes s2 { 0%, 32% { opacity: 0; } 34%, 52% { opacity: 1; } 54%, 100% { opacity: 0; } }
      @keyframes s3 { 0%, 70% { opacity: 0; } 72%, 90% { opacity: 1; } 92%, 100% { opacity: 0; } }

      .flow { stroke-dasharray: 6 6; animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -12; } }

      .sweep { animation: sweep 3.2s linear infinite; }
      @keyframes sweep { from { transform: translateY(-40px); } to { transform: translateY(220px); } }

      .led { animation: led 1.2s ease-in-out infinite alternate; }
      @keyframes led { from { opacity: 0.3; } to { opacity: 1; } }

      .lock { animation: lockpulse 1.4s ease-in-out infinite alternate; }
      @keyframes lockpulse { from { opacity: 0.7; } to { opacity: 1; } }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="379" rx="14" fill="#0d1117" stroke="#30363d"/>

  <!-- title -->
  <rect x="40" y="36" width="6" height="30" rx="3" fill="#C41E3A"/>
  <text x="58" y="52" font-size="20" font-weight="700" fill="#ffffff">safescreen</text>
  <text x="58" y="70" font-size="12" fill="#8b949e">Looks away? Blacked out. Someone watching? Blacked out.</text>

  <!-- webcam feed -->
  <text x="40" y="96" font-size="11" fill="#6e7681">webcam · processed on-device</text>
  <rect x="40" y="104" width="270" height="200" rx="10" fill="#0b0f14" stroke="#30363d"/>
  <g clip-path="url(#feedClip)">
    <rect class="sweep" x="40" y="104" width="270" height="40" fill="url(#sweep)"/>

    <!-- owner -->
    <g class="head">
      <path d="M78 304 C 84 262, 112 250, 140 250 S 196 262, 202 304 Z" fill="#161d27" stroke="#3a4556" stroke-width="1.5"/>
      <circle cx="140" cy="214" r="34" fill="#1c2430" stroke="#3a4556" stroke-width="1.5"/>
      <circle cx="128" cy="208" r="6.5" fill="#e6edf3"/>
      <circle cx="152" cy="208" r="6.5" fill="#e6edf3"/>
      <g class="pup">
        <circle cx="128" cy="208" r="3" fill="#0d1117"/>
        <circle cx="152" cy="208" r="3" fill="#0d1117"/>
      </g>
      <path d="M130 228 Q140 234 150 228" fill="none" stroke="#3a4556" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- owner detection boxes -->
    <g class="boxok">
      <rect x="98" y="172" width="84" height="86" rx="4" fill="none" stroke="#3fb950" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="98" y="167" font-size="11" fill="#3fb950">owner · looking</text>
    </g>
    <g class="boxaway">
      <rect x="90" y="172" width="84" height="86" rx="4" fill="none" stroke="#C41E3A" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="90" y="167" font-size="11" fill="#ff6b81">owner · away</text>
    </g>

    <!-- unknown face -->
    <g class="stranger">
      <path d="M226 304 C 230 280, 246 272, 260 272 S 290 280, 294 304 Z" fill="#241821" stroke="#7a2a3a" stroke-width="1.5"/>
      <circle cx="260" cy="248" r="22" fill="#2a1a20" stroke="#7a2a3a" stroke-width="1.5"/>
      <circle cx="252" cy="244" r="4.5" fill="#e6edf3"/>
      <circle cx="268" cy="244" r="4.5" fill="#e6edf3"/>
      <circle cx="250.5" cy="244" r="2" fill="#0d1117"/>
      <circle cx="266.5" cy="244" r="2" fill="#0d1117"/>
      <rect x="232" y="218" width="56" height="62" rx="4" fill="none" stroke="#C41E3A" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="200" y="213" font-size="11" fill="#ff6b81">unknown face</text>
    </g>
  </g>

  <!-- status line -->
  <g class="s1">
    <circle cx="48" cy="334" r="5" fill="#3fb950"/>
    <text x="62" y="338" font-size="13" fill="#3fb950">owner looking · screen visible</text>
  </g>
  <g class="s2">
    <circle cx="48" cy="334" r="5" fill="#f0b429"/>
    <text x="62" y="338" font-size="13" fill="#f0b429">looking away · screen hidden</text>
  </g>
  <g class="s3">
    <circle cx="48" cy="334" r="5" fill="#C41E3A"/>
    <text x="62" y="338" font-size="13" fill="#ff6b81">unknown face · screen hidden</text>
  </g>

  <!-- local-only link -->
  <path class="flow" d="M312 204 H438" fill="none" stroke="#484f58" stroke-width="2"/>
  <path d="M432 198 L440 204 L432 210" fill="none" stroke="#484f58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="375" y="228" font-size="10" fill="#6e7681" text-anchor="middle">no network</text>
  <text x="375" y="242" font-size="10" fill="#6e7681" text-anchor="middle">no telemetry</text>

  <!-- monitor -->
  <rect x="440" y="96" width="400" height="224" rx="10" fill="#161b22" stroke="#30363d" stroke-width="3"/>
  <circle class="led" cx="640" cy="104" r="2.5" fill="#3fb950"/>
  <rect x="452" y="112" width="376" height="196" rx="4" fill="#0b0f14"/>
  <rect x="620" y="320" width="40" height="16" fill="#21262d"/>
  <rect x="588" y="336" width="104" height="7" rx="3.5" fill="#30363d"/>

  <!-- screen content -->
  <rect x="452" y="112" width="376" height="22" fill="#161b22"/>
  <circle cx="465" cy="123" r="3" fill="#ff5f56"/>
  <circle cx="477" cy="123" r="3" fill="#ffbd2e"/>
  <circle cx="489" cy="123" r="3" fill="#27c93f"/>
  <rect x="470" y="150" width="130" height="12" rx="3" fill="#e6edf3" opacity="0.85"/>
  <rect x="470" y="176" width="300" height="8" rx="3" fill="#30363d"/>
  <rect x="470" y="192" width="276" height="8" rx="3" fill="#30363d"/>
  <rect x="470" y="208" width="310" height="8" rx="3" fill="#30363d"/>
  <rect x="470" y="224" width="210" height="8" rx="3" fill="#30363d"/>
  <rect x="470" y="248" width="96" height="8" rx="3" fill="#C41E3A" opacity="0.8"/>
  <rect x="470" y="264" width="288" height="8" rx="3" fill="#30363d"/>
  <rect x="470" y="280" width="180" height="8" rx="3" fill="#30363d"/>

  <!-- blackout cover -->
  <g class="cover">
    <rect x="452" y="112" width="376" height="196" rx="4" fill="#000000"/>
    <g class="lock">
      <path d="M631 205 V198 A9 9 0 0 1 649 198 V205" fill="none" stroke="#C41E3A" stroke-width="3.5" stroke-linecap="round"/>
      <rect x="624" y="205" width="32" height="24" rx="5" fill="#C41E3A"/>
      <circle cx="640" cy="216" r="3.2" fill="#000000"/>
      <rect x="638.8" y="216" width="2.4" height="8" rx="1.2" fill="#000000"/>
    </g>
    <text x="640" y="258" font-size="14" fill="#ff6b81" text-anchor="middle">screen hidden</text>
  </g>
</svg>
