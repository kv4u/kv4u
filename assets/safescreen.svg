      @keyframes btn1 { 0%{opacity:0;} 38.67%{opacity:0;} 39.05%{opacity:1;} 52.38%{opacity:1;} 53.33%{opacity:0;} 100%{opacity:0;} }
      @keyframes why1 { 0%{opacity:0;} 38.86%{opacity:0;} 39.05%{opacity:1;} 52.38%{opacity:1;} 52.57%{opacity:0;} 100%{opacity:0;} }
      @keyframes btn2 { 0%{opacity:0;} 72%{opacity:0;} 72.38%{opacity:1;} 85.71%{opacity:1;} 86.67%{opacity:0;} 100%{opacity:0;} }
      @keyframes why2 { 0%{opacity:0;} 72.19%{opacity:0;} 72.38%{opacity:1;} 85.71%{opacity:1;} 85.9%{opacity:0;} 100%{opacity:0;} }
