      @keyframes head { 0%{transform:translate(0px,0px);opacity:1;} 5.71%{transform:translate(0px,0px);opacity:1;} 7.62%{transform:translate(-18px,0px);opacity:1;} 19.05%{transform:translate(-18px,0px);opacity:1;} 21.43%{transform:translate(0px,0px);opacity:1;} 39.05%{transform:translate(0px,0px);opacity:1;} 41.43%{transform:translate(0px,70px);opacity:0;} 52.38%{transform:translate(0px,70px);opacity:0;} 55.24%{transform:translate(0px,0px);opacity:1;} 100%{transform:translate(0px,0px);opacity:1;} }
