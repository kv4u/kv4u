<style>
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace; }
      .sans { font-family: "Helvetica Neue", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Arial, sans-serif; }

      .stA { animation: stA 21s linear infinite; }
      .stB { opacity: 0; animation: stB 21s linear infinite; }
      .stC { opacity: 0; animation: stC 21s linear infinite; }
      .stD { opacity: 0; animation: stD 21s linear infinite; }
