<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Epochix turns Keras training logs into a plain-English story with a letter grade">
<defs>
<radialGradient id="glow" cx="0.85" cy="0.05" r="0.75"><stop offset="0" stop-color="#181939"/><stop offset="1" stop-color="#181939" stop-opacity="0"/></radialGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#111733"/></linearGradient>
<radialGradient id="gAmber"><stop offset="0" stop-color="#f97316" stop-opacity="0.30"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
<radialGradient id="gTeal"><stop offset="0" stop-color="#0ea599" stop-opacity="0.38"/><stop offset="1" stop-color="#0ea599" stop-opacity="0"/></radialGradient>
<style>
      .sans { font-family: Inter, "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
      .serif { font-family: Georgia, "Times New Roman", serif; font-weight: 700; }

      .st1 { animation: s1 20s ease-out infinite; }
      .st2 { animation: s2 20s ease-out infinite; }
      .st3 { animation: s3 20s ease-out infinite; }
      .st4 { animation: s4 20s ease-out infinite; }
      @keyframes s1 { 0%, 3% { opacity: 0; transform: translateY(6px); } 5.5%, 28% { opacity: 1; transform: translateY(0); } 30.5%, 100% { opacity: 0; transform: translateY(0); } }
      @keyframes s2 { 0%, 28% { opacity: 0; transform: translateY(6px); } 30.5%, 53% { opacity: 1; transform: translateY(0); } 55.5%, 100% { opacity: 0; transform: translateY(0); } }
      @keyframes s3 { 0%, 53% { opacity: 0; transform: translateY(6px); } 55.5%, 78% { opacity: 1; transform: translateY(0); } 80.5%, 100% { opacity: 0; transform: translateY(0); } }
      @keyframes s4 { 0%, 78% { opacity: 0; transform: translateY(6px); } 80.5%, 96% { opacity: 1; transform: translateY(0); } 99%, 100% { opacity: 0; transform: translateY(0); } }

      .lg1 { animation: l1 20s linear infinite; }
      .lg2 { animation: l2 20s linear infinite; }
      .lg3 { animation: l3 20s linear infinite; }
      .lg4 { animation: l4 20s linear infinite; }
      @keyframes l1 { 0%, 3% { opacity: 0; } 5%, 28% { opacity: 1; } 30%, 96% { opacity: 0.45; } 99%, 100% { opacity: 0; } }
      @keyframes l2 { 0%, 28% { opacity: 0; } 30%, 53% { opacity: 1; } 55%, 96% { opacity: 0.45; } 99%, 100% { opacity: 0; } }
      @keyframes l3 { 0%, 53% { opacity: 0; } 55%, 78% { opacity: 1; } 80%, 96% { opacity: 0.45; } 99%, 100% { opacity: 0; } }
      @keyframes l4 { 0%, 78% { opacity: 0; } 80%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }

      .net { animation: net 20s ease-in-out infinite; }
      @keyframes net { 0%, 28% { opacity: 0.3; } 32%, 53% { opacity: 0.5; } 57%, 78% { opacity: 0.8; } 82%, 96% { opacity: 1; } 99%, 100% { opacity: 0.3; } }
      .sigwrap { animation: sig 20s ease-in-out infinite; }
      @keyframes sig { 0%, 28% { opacity: 0.15; } 32%, 53% { opacity: 0.35; } 57%, 78% { opacity: 0.6; } 82%, 96% { opacity: 0.9; } 99%, 100% { opacity: 0.15; } }
      .sig { stroke-dasharray: 2 10; animation: flow 0.9s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -12; } }

      .chev { animation: chev 1.2s ease-in-out infinite; opacity: 0.2; }
      .c2 { animation-delay: 0.2s; }
      .c3 { animation-delay: 0.4s; }
      @keyframes chev { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }

      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    </style>
</defs>
