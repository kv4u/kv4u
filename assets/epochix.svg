<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="Epochix turns a training loss curve into plain-English narration">
  <defs>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }

      .train, .val { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 14s linear infinite; }
      @keyframes draw {
        0% { stroke-dashoffset: 1; opacity: 1; }
        72% { stroke-dashoffset: 0; opacity: 1; }
        93% { stroke-dashoffset: 0; opacity: 1; }
        98%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }

      .dot { animation: dotfade 14s linear infinite; }
      @keyframes dotfade { 0%, 93% { opacity: 1; } 98%, 100% { opacity: 0; } }

      .progress { transform-box: fill-box; transform-origin: left center; animation: grow 14s linear infinite; }
      @keyframes grow {
        0% { transform: scaleX(0); opacity: 1; }
        72% { transform: scaleX(1); opacity: 1; }
        93% { transform: scaleX(1); opacity: 1; }
        98%, 100% { transform: scaleX(1); opacity: 0; }
      }

      .n1 { animation: n1 14s ease-out infinite; }
      .n2 { animation: n2 14s ease-out infinite; }
      .n3 { animation: n3 14s ease-out infinite; }
      .n4 { animation: n4 14s ease-out infinite; }
      @keyframes n1 { 0%, 4% { opacity: 0; transform: translateY(8px); } 8%, 93% { opacity: 1; transform: translateY(0); } 98%, 100% { opacity: 0; transform: translateY(0); } }
      @keyframes n2 { 0%, 20% { opacity: 0; transform: translateY(8px); } 24%, 93% { opacity: 1; transform: translateY(0); } 98%, 100% { opacity: 0; transform: translateY(0); } }
      @keyframes n3 { 0%, 40% { opacity: 0; transform: translateY(8px); } 44%, 93% { opacity: 1; transform: translateY(0); } 98%, 100% { opacity: 0; transform: translateY(0); } }
      @keyframes n4 { 0%, 62% { opacity: 0; transform: translateY(8px); } 66%, 93% { opacity: 1; transform: translateY(0); } 98%, 100% { opacity: 0; transform: translateY(0); } }

      .ann { animation: ann 14s ease-out infinite; }
      @keyframes ann { 0%, 60% { opacity: 0; } 65%, 93% { opacity: 1; } 98%, 100% { opacity: 0; } }

      .ring { transform-box: fill-box; transform-origin: center; animation: ping 1.6s ease-out infinite; }
      @keyframes ping { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(1.8); opacity: 0; } }

      .live { animation: live 1.4s ease-in-out infinite alternate; }
      @keyframes live { from { opacity: 0.35; } to { opacity: 1; } }

      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    </style>
  </defs>

  <!-- window -->
  <rect x="20" y="16" width="860" height="328" rx="14" fill="#0d1117" stroke="#30363d"/>
  <line x1="20" y1="52" x2="880" y2="52" stroke="#21262d"/>
  <circle cx="42" cy="34" r="5" fill="#ff5f56"/>
  <circle cx="60" cy="34" r="5" fill="#ffbd2e"/>
  <circle cx="78" cy="34" r="5" fill="#27c93f"/>
  <text x="100" y="38" font-size="12" fill="#8b949e">epochix · run_042 · resnet18 on cifar10</text>
  <circle class="live" cx="800" cy="34" r="4" fill="#2dd4bf"/>
  <text x="811" y="38" font-size="12" fill="#2dd4bf">live</text>

  <!-- chart panel -->
  <text x="70" y="86" font-size="12" fill="#c9d1d9">training loss</text>
  <line x1="350" y1="82" x2="366" y2="82" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
  <text x="372" y="86" font-size="11" fill="#8b949e">train</text>
  <line x1="424" y1="82" x2="440" y2="82" stroke="#f0b429" stroke-width="3" stroke-linecap="round"/>
  <text x="446" y="86" font-size="11" fill="#8b949e">val</text>

  <g stroke="#21262d" stroke-width="1">
    <line x1="70" y1="136" x2="490" y2="136"/>
    <line x1="70" y1="172" x2="490" y2="172"/>
    <line x1="70" y1="208" x2="490" y2="208"/>
    <line x1="70" y1="244" x2="490" y2="244"/>
  </g>
  <line x1="70" y1="100" x2="70" y2="280" stroke="#30363d" stroke-width="1.5"/>
  <line x1="70" y1="280" x2="490" y2="280" stroke="#30363d" stroke-width="1.5"/>

  <!-- overfitting gap -->
  <path class="ann" d="M340 246 C 400 242, 450 230, 490 214 L490 272 C 450 271, 400 270, 340 266 Z" fill="#f0b429" fill-opacity="0.14"/>

  <!-- curves -->
  <path class="val" pathLength="1" d="M70 118 C 110 188, 150 232, 210 240 S 290 248, 340 246 S 420 236, 490 214" fill="none" stroke="#f0b429" stroke-width="3" stroke-linecap="round"/>
  <path class="train" pathLength="1" d="M70 112 C 110 190, 150 245, 210 258 S 330 268, 490 272" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>

  <!-- moving dots -->
  <g class="dot">
    <circle r="9" fill="#2dd4bf" opacity="0.25">
      <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.72;1" path="M70 112 C 110 190, 150 245, 210 258 S 330 268, 490 272"/>
    </circle>
    <circle r="4.5" fill="#2dd4bf">
      <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.72;1" path="M70 112 C 110 190, 150 245, 210 258 S 330 268, 490 272"/>
    </circle>
    <circle r="9" fill="#f0b429" opacity="0.25">
      <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.72;1" path="M70 118 C 110 188, 150 232, 210 240 S 290 248, 340 246 S 420 236, 490 214"/>
    </circle>
    <circle r="4.5" fill="#f0b429">
      <animateMotion dur="14s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.72;1" path="M70 118 C 110 188, 150 232, 210 240 S 290 248, 340 246 S 420 236, 490 214"/>
    </circle>
  </g>

  <!-- overfitting marker -->
  <g class="ann">
    <circle class="ring" cx="430" cy="234" r="8" fill="none" stroke="#f0b429" stroke-width="2"/>
    <circle cx="430" cy="234" r="3.5" fill="#f0b429"/>
    <line x1="426" y1="228" x2="398" y2="204" stroke="#f0b429" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="330" y="200" font-size="12" fill="#f0b429">overfitting?</text>
  </g>

  <!-- epoch progress -->
  <rect x="70" y="292" width="420" height="3" rx="1.5" fill="#21262d"/>
  <rect class="progress" x="70" y="292" width="420" height="3" rx="1.5" fill="#2dd4bf"/>
  <text x="70" y="316" font-size="11" fill="#6e7681">epoch 1</text>
  <text x="490" y="316" font-size="11" fill="#6e7681" text-anchor="end">epoch 45</text>

  <!-- divider -->
  <line x1="520" y1="64" x2="520" y2="330" stroke="#21262d"/>

  <!-- narrator panel -->
  <rect x="540" y="70" width="18" height="18" rx="4" fill="#2dd4bf"/>
  <path d="M552 74 H545 V84 H552 M545 79 H551" fill="none" stroke="#0d1117" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="566" y="84" font-size="12" fill="#8b949e">narrator · plain English</text>

  <g class="n1">
    <text x="540" y="122" font-size="12" fill="#2dd4bf">epoch 01 · loss 2.31</text>
    <text x="540" y="142" font-size="13" fill="#e6edf3">Guessing. It all looks like noise.</text>
  </g>
  <g class="n2">
    <text x="540" y="177" font-size="12" fill="#2dd4bf">epoch 12 · loss 0.52</text>
    <text x="540" y="197" font-size="13" fill="#e6edf3">First patterns found: edges, shapes.</text>
  </g>
  <g class="n3">
    <text x="540" y="232" font-size="12" fill="#2dd4bf">epoch 28 · loss 0.19</text>
    <text x="540" y="252" font-size="13" fill="#e6edf3">Steady progress. All good.</text>
  </g>
  <g class="n4">
    <text x="540" y="287" font-size="12" fill="#f0b429">epoch 41 · val loss rising</text>
    <text x="540" y="307" font-size="13" fill="#e6edf3">Heads up: it may be memorizing</text>
    <text x="540" y="325" font-size="13" fill="#e6edf3">the training set.</text>
    <rect class="cursor" x="680" y="314" width="7" height="14" fill="#f0b429"/>
  </g>
</svg>
